[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphdispatch"
version = "0.1.0"
description = "GraphDispatch: graph-backed emergency dispatch decision support (synthetic data)"
requires-python = ">=3.12"
dependencies = ["falkordb", "python-dotenv", "boto3", "mcp", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest", "networkx", "osmnx", "pandas"]

[tool.setuptools.packages.find]
include = ["graphdispatch*"]

[tool.setuptools.package-data]
graphdispatch = ["*.cypher"]
